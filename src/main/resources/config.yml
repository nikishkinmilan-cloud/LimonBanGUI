# Контакт для апелляции, показывается на экране бана (кликабельная ссылка на Telegram)
telegram-contact: "@MIlan4ck3456"

# Причины бана во вкладке "Забанить". Показываются в меню в этом порядке.
# key         — техническое имя (для логов)
# label       — текст на кнопке
# days        — срок бана в днях (игнорируется, если permanent: true)
# permanent   — true = бан навсегда
# dramatic    — true = эффектный бан (подкинуть на 5 блоков + выронить все ресурсы).
#               Используй true ТОЛЬКО для реальных читеров (п.1.2), иначе ресурсы
#               будут теряться зря при обычных банах.
ban-reasons:
  - key: "1.2"
    label: "1.2 — Читы / сторонний софт"
    days: 14
    dramatic: true
  - key: "1.3"
    label: "1.3 — Багоюз / дюп"
    days: 21
    dramatic: false
  - key: "1.4"
    label: "1.4 — Обман доната"
    permanent: true
    dramatic: false
  - key: "1.5"
    label: "1.5 — Трапперство на спавне"
    days: 1
    dramatic: false
  - key: "2.2"
    label: "2.2 — Оскорбление родных"
    days: 3
    dramatic: false
  - key: "2.3"
    label: "2.3 — Реклама"
    days: 7
    dramatic: false
  - key: "2.4"
    label: "2.4 — Выдача себя за персонал"
    days: 1
    dramatic: false
  - key: "refusal"
    label: "Отказ от проверки"
    days: 7
    dramatic: false
  - key: "inadequate"
    label: "Неадекват"
    days: 3
    dramatic: false

# Бан за выход с сервера прямо во время проверки (срабатывает автоматически)
leave-review-ban:
  reason: "Лив с проверки"
  days: 7

# Пороги для цвета цифры над головой (значение = уровень подозрения из LimonAntiCheat)
trust-thresholds:
  green-max: 0.10
  yellow-max: 0.50

# Как часто (в тиках) обновлять позицию и текст цифр над головами. 20 тиков = 1 сек
update-interval-ticks: 10

# Дальность поиска цели при быстром вызове на проверку (shift + ЛКМ по игроку)
quick-target-range: 5.0
