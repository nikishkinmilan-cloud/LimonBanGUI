# Длительность бана в днях, выдаваемого через меню
ban-days: 25

# Категории во вкладке "Забанить -> Античит"
# key = что покажется в баг-репорте / логе, label = текст на кнопке в меню
anticheat-categories:
  - key: "2.4"
    label: "п.2.4 — использование читов"
  - key: "2.4.1"
    label: "п.2.4.1 — авто-фарм/авто-клик"
  - key: "2.4.2"
    label: "п.2.4.2 — обход анти-чита"

# Пороги для цвета цифры над головой (значение = уровень подозрения из LimonAntiCheat)
trust-thresholds:
  green-max: 0.10   # 0.00–0.10 -> зелёный, "чист"
  yellow-max: 0.50  # 0.11–0.50 -> жёлтый, "под вопросом"
  # выше yellow-max -> красный, "на проверку"

# Как часто (в тиках) обновлять позицию и текст цифр над головами. 20 тиков = 1 сек
update-interval-ticks: 10
